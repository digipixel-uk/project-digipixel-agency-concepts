# Static-only local DigiPixel agency concept server, never a production web backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Preview content should never be indexed or cached.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Inline UI scripts and styles belong to the static prototypes.
    # Form submissions and network requests are explicitly disabled.
    add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; img-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;

    location = /_health {
        access_log off;
        add_header X-Robots-Tag "noindex" always;
        return 200 'ok';
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(php[0-9]?|phtml|phar|log|ini|conf|sql|bak|backup|old|orig|save|swp|dist|sh|env)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
